<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1d2436"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4deeea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4deeea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#E8E0C6" opacity="0.8">
    <rect x="30" y="25" width="2" height="2"/>
    <rect x="75" y="15" width="3" height="3"/>
    <rect x="120" y="45" width="2" height="2"/>
    <rect x="180" y="20" width="2" height="2"/>
    <rect x="230" y="35" width="3" height="3"/>
    <rect x="270" y="18" width="2" height="2"/>
    <rect x="45" y="80" width="2" height="2"/>
    <rect x="210" y="70" width="2" height="2"/>
    <rect x="150" y="10" width="4" height="4" fill="#ffd166"/>
  </g>
  <!-- Moon -->
  <circle cx="240" cy="50" r="20" fill="#E8E0C6"/>
  <circle cx="232" cy="46" r="17" fill="#0e1424"/>
