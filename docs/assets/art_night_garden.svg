  <path d="M165 180 Q168 160 172 152" stroke="#2ec4b6" stroke-width="3" fill="none"/>
  <path d="M162 152 C162 140 182 140 182 152 Z" fill="#70e000"/>
  
  <path d="M105 180 Q100 165 95 158" stroke="#2ec4b6" stroke-width="3" fill="none"/>
  <path d="M88 158 C88 148 102 148 102 158 Z" fill="#ff70a6"/>

