<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181024"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#cyberbg)"/>
  <!-- Neon grid lines -->
  <g stroke="#ff007f" stroke-width="1" opacity="0.2">
    <line x1="0" y1="150" x2="300" y2="150"/>
    <line x1="0" y1="170" x2="300" y2="170"/>
    <line x1="0" y1="185" x2="300" y2="185"/>
    <line x1="0" y1="195" x2="300" y2="195"/>
    <line x1="50" y1="150" x2="10" y2="200"/>
    <line x1="100" y1="150" x2="80" y2="200"/>
    <line x1="150" y1="150" x2="150" y2="200"/>
    <line x1="200" y1="150" x2="220" y2="200"/>
    <line x1="250" y1="150" x2="290" y2="200"/>
  </g>
  <!-- Cyberpunk Pixel Bot -->
  <rect x="115" y="50" width="70" height="60" rx="8" fill="#252525" stroke="#00f5d4" stroke-width="3"/>
  <!-- Eyes -->
  <rect x="128" y="68" width="14" height="10" rx="3" fill="#ff007f"/>
  <rect x="158" y="68" width="14" height="10" rx="3" fill="#ff007f"/>
  <circle cx="134" cy="72" r="2" fill="#fff"/>
  <circle cx="164" cy="72" r="2" fill="#fff"/>
  <!-- Antenna -->
  <line x1="150" y1="50" x2="150" y2="35" stroke="#00f5d4" stroke-width="3"/>
  <circle cx="150" cy="32" r="5" fill="#fee440"/>
  <!-- Chat bubbles -->
  <rect x="30" y="60" width="70" height="28" rx="6" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="1.5"/>
  <text x="42" y="78" font-family="monospace" font-size="11" fill="#00f5d4">Auto AI</text>
  <rect x="200" y="85" width="75" height="28" rx="6" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1.5"/>
  <text x="212" y="103" font-family="monospace" font-size="11" fill="#ff007f">Ready!</text>
</svg>