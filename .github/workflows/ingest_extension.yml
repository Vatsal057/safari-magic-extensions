name: Ingest Extension Submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'extension-submission') || (github.event.label && github.event.label.name == 'extension-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install PyGithub requests

      - name: Ingest from Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/ingest_issue.py

      - name: Verify package
        run: python3 scripts/verify_packages.py

      - name: Generate Thumbnails
        run: bash scripts/generate_thumbnails.sh

      - name: Build Registry
        run: python3 scripts/build_registry.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: ingest extension from issue #${{ github.event.issue.number }}"
          title: "Ingest Extension from Issue #${{ github.event.issue.number }}"
          body: "Automated PR to ingest extension submission from issue #${{ github.event.issue.number }}."
          branch: "ingest-issue-${{ github.event.issue.number }}"
          labels: "automated-pr, extension-submission"
          
      - name: Comment on Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            I've processed this submission and opened a PR! Maintainers will review it shortly.
