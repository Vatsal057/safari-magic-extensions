name: Ingest Extension Submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'extension-submission') || (github.event.label && github.event.label.name == 'extension-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install PyGithub requests

      - name: Ingest from Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/ingest_issue.py

      - name: Verify package
        run: python3 scripts/verify_packages.py

      - name: Generate Thumbnails
        run: bash scripts/generate_thumbnails.sh

      - name: Build Registry
        run: python3 scripts/build_registry.py

      - name: Commit and Push to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/packages/ web/assets/thumbnails/ web/community_registry.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(registry): publish extension from issue #${{ github.event.issue.number }}"
            git push origin main
          fi

      - name: Close Issue with Success Message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🎉 **Extension Published!**
          
          Your extension has been verified, screenshots generated, and it is now live in the Community Gallery and available for 1-click install via the CLI! 🪄"
          gh issue close ${{ github.event.issue.number }} --reason completed
