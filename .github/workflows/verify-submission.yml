name: Verify Extension Submission

on:
  pull_request:
    paths:
      - 'web/packages/**'
      - 'web/registry_curation.json'
      - 'web/community_registry.json'
      - 'scripts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Archive safety, required metadata, and registry ID uniqueness.
      # Results are published to the job summary.
      - name: Verify packages
        run: python3 scripts/verify_packages.py

      # Fails if the committed registry does not match the packages on disk,
      # so the published catalog is always reviewable in the diff.
      - name: Check registry is up to date
        run: python3 scripts/build_registry.py --check
