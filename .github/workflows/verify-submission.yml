name: Verify Extension Submission

on:
  pull_request:
    paths:
      - 'packages/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Packages & Security
        id: verify_packages
        run: |
          python3 - << 'EOF'
          import os, sys, zipfile, json, pathlib

          packages_dir = pathlib.Path("packages")
          packages = list(packages_dir.glob("*.magicext"))
          if not packages:
              print("No .magicext packages found in packages/")
              sys.exit(0)

          print(f"Inspecting {len(packages)} package(s)...")
          errors = []
          summary_rows = []

          for pkg in packages:
              print(f"\nChecking: {pkg.name}")
              try:
                  with zipfile.ZipFile(pkg, "r") as zf:
                      names = zf.namelist()
                      # 1. Security Check: Zip Slip
                      for member in names:
                          if member.startswith("/") or ".." in member:
                              errors.append(f"{pkg.name}: Zip traversal pattern detected in '{member}'")

                      # 2. magic.json check
                      if "magic.json" not in names:
                          errors.append(f"{pkg.name}: Missing magic.json")
                      else:
                          meta = json.loads(zf.read("magic.json").decode("utf-8"))
                          if not meta.get("name"):
                              errors.append(f"{pkg.name}: magic.json missing 'name'")
                          if not meta.get("prompt"):
                              errors.append(f"{pkg.name}: magic.json missing 'prompt'")

                      # 3. manifest.json check
                      if "manifest.json" not in names:
                          errors.append(f"{pkg.name}: Missing manifest.json")

                      summary_rows.append(f"| {meta.get('name', pkg.name)} | @{meta.get('author', 'unknown')} | {meta.get('selected_symbol', 'puzzlepiece')} ({meta.get('symbol_color_name', 'blue')}) |")

              except Exception as e:
                  errors.append(f"{pkg.name}: Failed to read archive: {e}")

          if errors:
              print("\n❌ Errors found during validation:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print("\n✓ All packages passed security and metadata validation!")
          EOF

      - name: Test Registry Build
        run: |
          python3 build_registry.py
