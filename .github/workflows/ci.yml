name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} & registry
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what macOS ships as /usr/bin/python3, so the CLI must run on
        # it: a non-technical user will not install a newer Python.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The CLI is stdlib-only, so a syntax check is a meaningful smoke test.
      - name: Byte-compile all Python
        run: python3 -m compileall -q safari-magic-ext.py scripts/

      - name: Verify packages
        run: python3 scripts/verify_packages.py

      - name: Check registry is up to date
        run: python3 scripts/build_registry.py --check

      - name: CLI reports a version
        run: python3 safari-magic-ext.py --version

      - name: CLI help for every subcommand
        run: |
          set -euo pipefail
          python3 safari-magic-ext.py --help >/dev/null
          for cmd in list explore pack convert submit install export add update sync gui; do
            echo "  checking: $cmd"
            python3 safari-magic-ext.py "$cmd" --help >/dev/null
          done

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            install-cli.sh \
            scripts/generate_thumbnails.sh
