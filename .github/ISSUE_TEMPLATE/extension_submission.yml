name: "🪄 Submit a Safari AI Extension"
description: "Submit your AI-generated Safari Magic Extension to the community gallery"
title: "[Extension Submission]: <Extension Name>"
labels: ["extension-submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for sharing your creation!
        Please fill out this form to submit your AI-generated Safari Magic Extension.
        Once reviewed and approved, it will be published to the Community Gallery and CLI catalog.

  - type: input
    id: extension_name
    attributes:
      label: Extension Name
      description: The user-facing display title of your extension.
      placeholder: "e.g. Zen Focus & Ambient Timer"
    validations:
      required: true

  - type: input
    id: author_handle
    attributes:
      label: Author Name / GitHub Handle
      description: Who should receive credit for this extension?
      placeholder: "e.g. your-github-username"
    validations:
      required: true

  - type: textarea
    id: ai_prompt
    attributes:
      label: Original AI Generation Prompt
      description: The exact natural language prompt you used to generate this extension in Safari.
      placeholder: "e.g. Create a peaceful new tab page with a 25-minute Pomodoro timer, lo-fi ambient animations, and daily intention tasks."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Extension Description
      description: A 1-2 sentence description of what the extension does.
      placeholder: "A minimalist new tab productivity tool with ambient timer and goal tracker."
    validations:
      required: true

  - type: dropdown
    id: symbol_color
    attributes:
      label: SF Symbol Tint Color
      description: Badge color chosen for your extension in Safari.
      options:
        - blue
        - purple
        - green
        - orange
        - pink
        - gray
    validations:
      required: true

  - type: input
    id: selected_symbol
    attributes:
      label: SF Symbol Name
      description: The Apple SF Symbol icon name (if known).
      placeholder: "e.g. sparkles, moon.stars.fill, leaf.fill"
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      placeholder: "e.g. newtab, ambient, productivity, minimalist"
    validations:
      required: false

  - type: textarea
    id: package_upload
    attributes:
      label: Attach .magicext File
      description: Drag and drop your `.magicext` package file into this box (or provide a public download link).
      placeholder: "Attach your .magicext file here..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Verification
      options:
        - label: "I generated this extension with Safari AI or wrote the WebExtension code myself."
          required: true
        - label: "This extension contains no malicious scripts, trackers, or obfuscated code."
          required: true
        - label: "I tested this extension and verified it loads properly in Safari."
          required: true
